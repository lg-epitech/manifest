<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<!-- PLACEHOLDER: the title element names the page in `manifest list`. Same words as the h1, under 70 characters. -->
<title>[[Title]]</title>
<style>
/* ==========================================================================
   Quire, the manifest design language. Tokens first, then components.
   Do not add colors, sizes or fonts outside these tokens. See design/DESIGN.md.
   ========================================================================== */
:root {
  color-scheme: light dark;

  /* Neutrals */
  --bg: #ffffff;
  --surface: #f5f5f3;
  --ink: #1b1c20;
  --ink-2: #4b4d55;
  --ink-3: #6b6d76;
  --line: #e3e3df;
  --line-2: #c9c9c4;
  --control-border: #8a8c93; /* form controls: 3:1 against --bg (WCAG 1.4.11) */

  /* Accent: links, focus, primary button, first chart series */
  --accent: #0b6c78;
  --accent-ink: #085660;
  --accent-soft: #e6f2f3;

  /* Semantic, used only where a state means something */
  --ok: #2f6f3e;   --ok-soft: #e8f2ea;
  --warn: #8f5a00; --warn-soft: #f9f0dc;
  --bad: #a83a32;  --bad-soft: #f8e7e5;

  /* Charts: at most three series */
  --chart-1: var(--accent);
  --chart-2: #8d8f97;
  --chart-3: #a87414;
  --chart-grid: var(--line);

  /* Type */
  --font-text: Charter, "Iowan Old Style", "Source Serif 4", "Source Serif Pro", Georgia, "Noto Serif", serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --text: 1.0625rem;   /* 17px body */
  --text-lh: 1.55;
  --small: 0.875rem;   /* 14px: tables, captions, meta, controls */
  --xs: 0.8125rem;     /* 13px: badges, chart labels */
  --h1: 2rem;
  --h2: 1.375rem;
  --h3: 1.0625rem;
  --summary: 1.25rem;
  --stat: 1.75rem;

  /* Space (4px base) */
  --s1: 0.25rem; --s2: 0.5rem; --s3: 0.75rem; --s4: 1rem;
  --s5: 1.5rem;  --s6: 2rem;   --s7: 3rem;    --s8: 4rem;

  /* Layout */
  --measure: 38rem;   /* prose column, about 75 characters */
  --wide: 58rem;      /* tables, figures, stat rows with .wide */
  --gutter: 1.25rem;
  --radius: 4px;
  --focus: 2px solid var(--accent);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181c;
    --surface: #1f2126;
    --ink: #e7e7e4;
    --ink-2: #b4b5ba;
    --ink-3: #8b8d94;
    --line: #2c2e35;
    --line-2: #44464e;
    --control-border: #6e7078;
    --accent: #6fc6d1;
    --accent-ink: #9ad9e1;
    --accent-soft: #1a2f33;
    --ok: #7fc48f;   --ok-soft: #1c2a1f;
    --warn: #e0b05a; --warn-soft: #2e2717;
    --bad: #ef8a82;  --bad-soft: #33201f;
    --chart-2: #8d8f97;
    --chart-3: #d7a24a;
  }
}
@media (max-width: 40rem) {
  :root {
    --text: 1rem;
    --h1: 1.625rem;
    --h2: 1.25rem;
    --summary: 1.125rem;
    --stat: 1.5rem;
    --gutter: 1rem;
  }
}

/* --------------------------------------------------------------------------
   Base
   -------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0 auto;
  max-width: calc(var(--wide) + 2 * var(--gutter));
  padding: 0 var(--gutter) var(--s7);
  font-family: var(--font-text);
  font-size: var(--text);
  line-height: var(--text-lh);
  color: var(--ink);
  background: var(--bg);
}
:focus-visible { outline: var(--focus); outline-offset: 2px; }
::selection { background: var(--accent-soft); }
img, svg, video { max-width: 100%; height: auto; }
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { transition: none !important; animation: none !important; }
}

/* --------------------------------------------------------------------------
   Headings and text
   -------------------------------------------------------------------------- */
h1, h2, h3, h4 {
  font-family: var(--font-ui);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin-block: 0;
  text-wrap: balance;
}
h1 { font-size: var(--h1); letter-spacing: -0.02em; margin-bottom: var(--s3); }
h2 { font-size: var(--h2); margin-top: var(--s7); margin-bottom: var(--s3); }
h3 { font-size: var(--h3); margin-top: var(--s6); margin-bottom: var(--s2); }
h4 { font-size: var(--small); margin-top: var(--s5); margin-bottom: var(--s2); color: var(--ink-2); }
h2 + h3 { margin-top: var(--s4); }
p { margin-block: 0 var(--s4); text-wrap: pretty; }
ul, ol { margin-block: 0 var(--s4); padding-left: 1.4rem; }
li { margin-bottom: var(--s1); }
li > ul, li > ol { margin-top: var(--s1); margin-bottom: 0; }
strong, b { font-weight: 700; }
small { font-size: var(--small); }
blockquote {
  margin-block: 0 var(--s4);
  padding-left: var(--s4);
  border-left: 2px solid var(--line-2);
  color: var(--ink-2);
}
blockquote > :last-child { margin-bottom: 0; }
hr { border: 0; border-top: 1px solid var(--line); margin-block: var(--s6); }
abbr[title] { text-decoration: underline dotted; text-underline-offset: 0.15em; }
.muted { color: var(--ink-3); }
.ui { font-family: var(--font-ui); }
.num, .tabular { font-variant-numeric: tabular-nums; }

/* Links */
a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
  text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent);
}
a:hover { color: var(--accent-ink); text-decoration-color: currentColor; }
.link-more {
  font-family: var(--font-ui);
  font-weight: 500;
  font-size: var(--small);
  text-decoration: none;
}
.link-more::after { content: " \2192"; }
.link-more:hover { text-decoration: underline; }
.ext::after { content: "\202F\2197"; font-family: var(--font-ui); font-size: 0.8em; }

/* --------------------------------------------------------------------------
   Document header and footer
   -------------------------------------------------------------------------- */
.doc-header {
  padding-top: var(--s7);
  padding-bottom: var(--s5);
  margin-bottom: var(--s6);
  border-bottom: 1px solid var(--line-2);
}
.summary {
  font-size: var(--summary);
  line-height: 1.4;
  color: var(--ink-2);
  margin-block: 0 var(--s4);
}
.meta {
  font-family: var(--font-ui);
  font-size: var(--small);
  color: var(--ink-3);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2) var(--s4);
  margin-block: 0;
}
.meta > * + *::before {
  content: "";
  display: inline-block;
  width: 1px;
  height: 0.9em;
  background: var(--line-2);
  margin-right: var(--s4);
  vertical-align: -0.1em;
}
.meta > .badge::before { display: none; }
.doc-footer {
  margin-top: var(--s8);
  padding-top: var(--s5);
  border-top: 1px solid var(--line);
  font-family: var(--font-ui);
  font-size: var(--small);
  color: var(--ink-3);
}
.doc-footer p { margin-bottom: var(--s2); }

/* --------------------------------------------------------------------------
   Tables
   -------------------------------------------------------------------------- */
.table-wrap { overflow-x: auto; margin-block: 0 var(--s5); }
.table-wrap > table { margin-bottom: 0; }
@media (min-width: 40rem) { .table-wrap:has(> .table-sticky) { overflow-x: visible; } }
.nowrap { white-space: nowrap; }
table {
  border-collapse: collapse;
  width: 100%;
  margin-block: 0 var(--s5);
  font-family: var(--font-ui);
  font-size: var(--small);
  line-height: 1.35;
  font-variant-numeric: tabular-nums;
}
caption {
  caption-side: top;
  text-align: left;
  font-weight: 600;
  color: var(--ink);
  padding-bottom: var(--s2);
}
caption .muted { font-weight: 400; }
@media (max-width: 40rem) { caption { max-width: calc(100vw - 2 * var(--gutter)); } }
th, td {
  padding: var(--s2) var(--s3);
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--line);
}
th { font-weight: 600; color: var(--ink-2); border-bottom-color: var(--line-2); }
thead th { vertical-align: bottom; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
th.num, td.num { text-align: right; }
td.num { color: var(--ink); }
tr.total th, tr.total td { font-weight: 600; border-top: 1px solid var(--line-2); border-bottom: 0; }
tr.highlight td { background: var(--accent-soft); }
tr.dim td { color: var(--ink-3); }
td.empty { text-align: center; color: var(--ink-3); padding-block: var(--s5); }
html:not(.js) tr.empty { display: none; }
.table-compact th, .table-compact td { padding: var(--s1) var(--s2); }
.table-sticky thead th { position: sticky; top: 0; background: var(--bg); z-index: 1; }
.table-note { font-family: var(--font-ui); font-size: var(--xs); color: var(--ink-3); margin-top: calc(-1 * var(--s4)); }
.table-wrap.wide + .table-note { max-width: none; } /* line up under a wide table */
.delta-good { color: var(--ok); }
.delta-bad { color: var(--bad); }
th.sort { cursor: pointer; }
th.sort:hover { color: var(--ink); }
th[aria-sort="ascending"]::after { content: " \2191"; color: var(--ink-3); }
th[aria-sort="descending"]::after { content: " \2193"; color: var(--ink-3); }

/* --------------------------------------------------------------------------
   Key figures
   -------------------------------------------------------------------------- */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr));
  gap: var(--s4) var(--s5);
  margin-block: var(--s5);
  font-family: var(--font-ui);
}
.stat { border-top: 1px solid var(--line-2); padding-top: var(--s3); }
.stat-value {
  display: block;
  font-size: var(--stat);
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.stat-value small { font-size: 0.55em; font-weight: 400; color: var(--ink-3); margin-left: 0.15em; }
.stat-label { display: block; font-size: var(--small); color: var(--ink-3); margin-top: var(--s1); }
.stat-note { display: block; font-size: var(--xs); margin-top: var(--s1); font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------------------------
   Callouts
   -------------------------------------------------------------------------- */
.note {
  border-left: 3px solid var(--line-2);
  background: var(--surface);
  padding: var(--s3) var(--s4);
  margin-block: var(--s5);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.note > :last-child { margin-bottom: 0; }
.note-title {
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: var(--small);
  margin-block: 0 var(--s1);
}
.note-info { border-left-color: var(--accent); }
.note-warn { border-left-color: var(--warn); }
.note-decision { border-left-color: var(--ink); }

/* --------------------------------------------------------------------------
   Badges
   -------------------------------------------------------------------------- */
.badge {
  display: inline-block;
  font-family: var(--font-ui);
  font-size: var(--xs);
  font-weight: 500;
  line-height: 1;
  padding: 0.3em 0.55em;
  border-radius: var(--radius);
  border: 1px solid var(--line-2);
  color: var(--ink-2);
  white-space: nowrap;
  vertical-align: middle;
}
.badge-ok, .badge-warn, .badge-bad, .badge-accent { border-color: color-mix(in srgb, currentColor 40%, transparent); }
.badge-ok { color: var(--ok); background: var(--ok-soft); }
.badge-warn { color: var(--warn); background: var(--warn-soft); }
.badge-bad { color: var(--bad); background: var(--bad-soft); }
.badge-accent { color: var(--accent); background: var(--accent-soft); }

/* --------------------------------------------------------------------------
   Code
   -------------------------------------------------------------------------- */
code, kbd, samp { font-family: var(--font-mono); font-size: 0.875em; }
:not(pre) > code, kbd {
  background: var(--surface);
  padding: 0.1em 0.3em;
  border-radius: var(--radius);
}
kbd { border: 1px solid var(--line-2); font-size: 0.8em; }
pre {
  font-family: var(--font-mono);
  font-size: var(--small);
  line-height: 1.5;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--s3) var(--s4);
  overflow-x: auto;
  margin-block: 0 var(--s5);
  tab-size: 2;
}
pre code { font-size: inherit; background: none; padding: 0; }

/* --------------------------------------------------------------------------
   Figures, images, charts
   -------------------------------------------------------------------------- */
figure { margin-block: var(--s5); margin-inline: 0; }
figure img, figure svg { display: block; }
figure img.framed { border: 1px solid var(--line); }
figcaption {
  font-family: var(--font-ui);
  font-size: var(--small);
  line-height: 1.4;
  color: var(--ink-3);
  margin-top: var(--s2);
}
figcaption b { color: var(--ink); font-weight: 600; }
.figure-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); align-items: start; }
.figure-pair figure { margin-block: 0; }
@media (max-width: 40rem) { .figure-pair { grid-template-columns: 1fr; } }

.chart { font-family: var(--font-ui); font-size: var(--xs); font-variant-numeric: tabular-nums; overflow-x: auto; }
.chart svg { width: 100%; min-width: 28rem; height: auto; display: block; overflow: visible; }
.chart.wide svg { min-width: 43rem; }
.chart text { fill: var(--ink-3); font-family: inherit; }
.chart .strong { fill: var(--ink); font-weight: 500; }
.chart .grid { stroke: var(--chart-grid); stroke-width: 1; }
.chart .axis { stroke: var(--line-2); stroke-width: 1; }
.chart .s1 { fill: var(--chart-1); }
.chart .s2 { fill: var(--chart-2); }
.chart .s3 { fill: var(--chart-3); }
.chart .l1, .chart .l2, .chart .l3 { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .l1 { stroke: var(--chart-1); }
.chart .l2 { stroke: var(--chart-2); }
.chart .l3 { stroke: var(--chart-3); }
.chart .area1 { fill: var(--chart-1); opacity: 0.12; }
.chart .marker { stroke: var(--bad); stroke-dasharray: 3 3; }
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2) var(--s4);
  font-family: var(--font-ui);
  font-size: var(--xs);
  color: var(--ink-2);
  margin-bottom: var(--s2);
}
.swatch {
  display: inline-block;
  width: 0.7em;
  height: 0.7em;
  border-radius: 2px;
  margin-right: 0.4em;
  vertical-align: -0.02em;
  background: var(--chart-1);
}
.swatch.s2 { background: var(--chart-2); }
.swatch.s3 { background: var(--chart-3); }
.sparkline { width: 5.5rem; height: 1.1em; vertical-align: middle; display: inline-block; }
.sparkline path { stroke: var(--chart-1); fill: none; stroke-width: 1.5; stroke-linejoin: round; }

/* --------------------------------------------------------------------------
   Key-value metadata, disclosure, tabs, steps, timeline, sources
   -------------------------------------------------------------------------- */
.kv {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: var(--s2) var(--s5);
  margin-block: 0 var(--s5);
}
.kv dt { font-family: var(--font-ui); font-size: var(--small); color: var(--ink-3); padding-top: 0.2em; }
.kv dd { margin: 0; }
@media (max-width: 30rem) {
  .kv { grid-template-columns: 1fr; gap: 0; }
  .kv dt { padding-top: 0; }
  .kv dd { margin-bottom: var(--s3); }
}

details { border-top: 1px solid var(--line); padding: var(--s3) 0; }
details:not(:has(+ details)) { border-bottom: 1px solid var(--line); margin-bottom: var(--s5); }
details > :last-child { margin-bottom: 0; }
summary {
  font-family: var(--font-ui);
  font-weight: 500;
  font-size: var(--small);
  cursor: pointer;
  list-style: none;
  display: flex;
  gap: var(--s2);
  align-items: baseline;
}
summary::-webkit-details-marker { display: none; }
summary::before { content: "\25B8"; color: var(--ink-3); font-size: 0.9em; transition: transform 0.15s; }
details[open] > summary::before { transform: rotate(90deg); }
details[open] > summary { margin-bottom: var(--s3); }

.tabs { margin-block: 0 var(--s5); }
.tablist {
  display: flex;
  gap: var(--s5);
  border-bottom: 1px solid var(--line-2);
  margin-block: 0 var(--s4);
  overflow-x: auto;
}
.tab {
  font-family: var(--font-ui);
  font-size: var(--small);
  font-weight: 500;
  color: var(--ink-3);
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: var(--s2) 0;
  cursor: pointer;
  white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabpanel[hidden] { display: none; }
.js .tabpanel > .tab-heading { display: none; }

.steps, .timeline { list-style: none; padding: 0; margin-block: 0 var(--s5); }
.steps { counter-reset: step; }
.steps > li, .timeline > li {
  display: grid;
  gap: var(--s4);
  padding: var(--s3) 0;
  margin: 0;
  border-top: 1px solid var(--line);
}
.steps > li:last-child, .timeline > li:last-child { border-bottom: 1px solid var(--line); }
.steps > li { grid-template-columns: 1.75rem 1fr; }
.steps > li::before {
  counter-increment: step;
  content: counter(step);
  font-family: var(--font-ui);
  font-size: var(--small);
  font-variant-numeric: tabular-nums;
  color: var(--ink-3);
  padding-top: 0.2em;
}
.timeline > li { grid-template-columns: minmax(7rem, max-content) 1fr; }
.timeline .when {
  font-family: var(--font-ui);
  font-size: var(--small);
  font-variant-numeric: tabular-nums;
  color: var(--ink-3);
  padding-top: 0.2em;
  white-space: nowrap;
}
.steps > li > :last-child, .timeline > li > :last-child { margin-bottom: 0; }
@media (max-width: 40rem) {
  .timeline > li { grid-template-columns: 1fr; gap: var(--s1); }
}

.sources { font-size: var(--small); color: var(--ink-2); padding-left: 1.5rem; }
.sources li { margin-bottom: var(--s2); }
sup.fn { font-family: var(--font-ui); font-size: 0.7em; line-height: 0; }
sup.fn a { text-decoration: none; }

/* --------------------------------------------------------------------------
   Controls (in-page only: forms cannot submit anywhere)
   -------------------------------------------------------------------------- */
.form-inline {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s3) var(--s4);
  align-items: flex-end;
  margin-block: 0 var(--s5);
  font-family: var(--font-ui);
  font-size: var(--small);
}
.field { display: flex; flex-direction: column; gap: var(--s1); font-family: var(--font-ui); font-size: var(--small); }
.field.grow { flex: 1 1 12rem; }
label { font-family: var(--font-ui); font-size: var(--small); font-weight: 500; color: var(--ink-2); }
.check { display: flex; gap: var(--s2); align-items: center; font-weight: 400; color: var(--ink); cursor: pointer; }
input[type="text"], input[type="number"], input[type="search"], input[type="date"], select, textarea {
  font: inherit;
  font-family: var(--font-ui);
  font-size: var(--small);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--control-border);
  border-radius: var(--radius);
  padding: 0.4rem 0.6rem;
  min-height: 2.125rem;
  max-width: 100%;
}
input[type="number"] { font-variant-numeric: tabular-nums; width: 8rem; }
input::placeholder { color: var(--ink-3); }
input:hover, select:hover, textarea:hover { border-color: var(--ink-3); }
select {
  appearance: none;
  padding-right: 1.9rem;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%236b6d76' stroke-width='1.5'/></svg>");
  background-repeat: no-repeat;
  background-position: right 0.65rem center;
}
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 1rem; height: 1rem; margin: 0; }
input[type="checkbox"].switch {
  appearance: none;
  width: 2.125rem;
  height: 1.25rem;
  border-radius: 1rem;
  background: var(--control-border);
  position: relative;
  transition: background 0.15s;
  cursor: pointer;
}
input[type="checkbox"].switch::before {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: calc(1.25rem - 4px);
  height: calc(1.25rem - 4px);
  border-radius: 50%;
  background: var(--bg);
  transition: transform 0.15s;
}
input[type="checkbox"].switch:checked { background: var(--accent); }
input[type="checkbox"].switch:checked::before { transform: translateX(0.875rem); }
.btn {
  font-family: var(--font-ui);
  font-size: var(--small);
  font-weight: 500;
  line-height: 1.2;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--control-border);
  border-radius: var(--radius);
  padding: 0.5rem 0.9rem;
  min-height: 2.125rem;
  cursor: pointer;
}
.btn:hover { border-color: var(--ink-3); }
.btn-primary { color: var(--bg); background: var(--accent); border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn:disabled { opacity: 0.5; cursor: default; }
output { font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.js-only { display: none; }
.js .js-only { display: revert; }

/* --------------------------------------------------------------------------
   Layout: prose is held to the measure; add .wide to let an element span the
   full column (tables, figures, stat rows, code). Keep this rule last.
   -------------------------------------------------------------------------- */
:where(header, main, footer, section, article, .tabs, .tabpanel) > :not(.wide, section, article, .tabs, .tabpanel, script, style) {
  max-width: var(--measure);
  margin-inline: auto;
}
.wide { max-width: none; margin-inline: auto; }
figure.figure-inline { max-width: 20rem; }

/* --------------------------------------------------------------------------
   Print
   -------------------------------------------------------------------------- */
@media print {
  :root {
    --bg: #fff; --surface: #f4f4f4; --ink: #000; --ink-2: #333; --ink-3: #555;
    --line: #ccc; --line-2: #999; --accent: #000; --accent-soft: #eee;
    --text: 10.5pt; --small: 9pt; --xs: 8pt; --h1: 20pt; --h2: 14pt; --summary: 12pt; --stat: 16pt;
  }
  html { color-scheme: light; }
  body { max-width: none; padding: 0; }
  .doc-header { padding-top: 0; }
  a { color: inherit; }
  main a[href^="http"]:not(.link-more)::after { content: " (" attr(href) ")"; font-size: 0.85em; color: #555; word-break: break-all; }
  .table-wrap { overflow: visible; }
  .table-sticky thead th { position: static; }
  thead { display: table-header-group; }
  tr, figure, .note, .stat, pre, .steps > li, .timeline > li { break-inside: avoid; }
  h2, h3, h4, caption { break-after: avoid; }
  .tablist, .form-inline, .btn, input, select, .js-only { display: none !important; }
  .tabpanel[hidden] { display: block; }
  .js .tabpanel > .tab-heading { display: block; }
}
</style>
</head>
<body>

<header class="doc-header">
  <!-- PLACEHOLDER: title, one-line summary, meta line. Keep all three. -->
  <h1>[[Title]]</h1>
  <p class="summary">[[One sentence that says what this page concludes or contains.]]</p>
  <p class="meta">
    <time datetime="[[2026-01-31]]">[[31 January 2026]]</time>
    <span>[[Author]]</span>
    <!-- Optional status: <span class="badge">Draft</span> or badge-ok / badge-warn / badge-bad / badge-accent -->
  </p>
</header>

<main>
  <!-- PLACEHOLDER: body. Use h2 for sections, h3 for subsections. Components: templates/components.html -->
  <h2>[[First section]]</h2>
  <p>[[Body text.]]</p>
</main>

<footer class="doc-footer">
  <!-- PLACEHOLDER: who wrote it, when, where the source lives. One or two lines. -->
  <p>[[Prepared by Author, 31 January 2026.]]</p>
</footer>

<script>
/* Optional enhancements: tabs, table filter, sortable tables. The page reads
   fully without them. Never touch web storage, cookies or client-side
   databases here: the page runs in a sandboxed origin and they throw. */
(function () {
  'use strict';
  try {
    document.documentElement.classList.add('js');

    /* Safety net: wrap any bare table so it scrolls sideways on narrow screens instead of widening the page. */
    document.querySelectorAll('table').forEach(function (t) {
      if (t.parentElement.classList.contains('table-wrap')) return;
      var w = document.createElement('div');
      w.className = 'table-wrap' + (t.classList.contains('wide') ? ' wide' : '');
      t.classList.remove('wide');
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });

    /* Tabs: <div class="tabs"> containing <section class="tabpanel"> each with an h3 (or data-label). */
    document.querySelectorAll('.tabs').forEach(function (tabs, g) {
      var panels = Array.prototype.slice.call(tabs.children).filter(function (el) { return el.classList.contains('tabpanel'); });
      if (panels.length < 2) return;
      var list = document.createElement('div');
      list.className = 'tablist';
      list.setAttribute('role', 'tablist');
      var buttons = panels.map(function (panel, i) {
        var heading = panel.querySelector('h2, h3, h4');
        var label = panel.getAttribute('data-label') || (heading ? heading.textContent : 'Tab ' + (i + 1));
        var id = panel.id || (tabs.id || 'tabs' + (g + 1)) + '-' + (i + 1);
        panel.id = id;
        panel.setAttribute('role', 'tabpanel');
        panel.setAttribute('tabindex', '0');
        if (heading && heading === panel.firstElementChild) heading.classList.add('tab-heading');
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'tab';
        b.id = id + '-tab';
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-controls', id);
        b.textContent = label;
        panel.setAttribute('aria-labelledby', b.id);
        b.addEventListener('click', function () { select(i); });
        b.addEventListener('keydown', function (e) {
          var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
          if (!d) return;
          e.preventDefault();
          var n = (i + d + panels.length) % panels.length;
          select(n);
          buttons[n].focus();
        });
        list.appendChild(b);
        return b;
      });
      function select(n) {
        panels.forEach(function (p, j) { p.hidden = j !== n; });
        buttons.forEach(function (b, j) {
          b.setAttribute('aria-selected', j === n ? 'true' : 'false');
          b.tabIndex = j === n ? 0 : -1;
        });
      }
      tabs.insertBefore(list, panels[0]);
      select(0);
    });

    /* Table filter: <input type="search" data-filter="#table-id">. A <tr class="empty"> row, if present, shows when nothing matches. */
    document.querySelectorAll('input[data-filter]').forEach(function (input) {
      var table = document.querySelector(input.getAttribute('data-filter'));
      if (!table) return;
      var rows = Array.prototype.slice.call(table.querySelectorAll('tbody tr'));
      var empty = table.querySelector('tr.empty');
      if (empty) empty.hidden = true;
      input.addEventListener('input', function () {
        var q = input.value.trim().toLowerCase();
        var shown = 0;
        rows.forEach(function (r) {
          if (r === empty) return;
          var hit = !q || r.textContent.toLowerCase().indexOf(q) !== -1;
          r.hidden = !hit;
          if (hit) shown++;
        });
        if (empty) empty.hidden = shown > 0;
      });
    });

    /* Sortable tables: <table class="sortable">. Click a header to sort; columns with th.num sort numerically. tr.total stays last. */
    document.querySelectorAll('table.sortable').forEach(function (table) {
      var tbody = table.tBodies[0];
      if (!tbody) return;
      var heads = Array.prototype.slice.call(table.querySelectorAll('thead th'));
      heads.forEach(function (th, col) {
        th.tabIndex = 0;
        th.classList.add('sort');
        th.setAttribute('aria-sort', 'none');
        function num(s) { return parseFloat(s.replace(/−/g, '-').replace(/[^0-9.\-]/g, '')) || 0; }
        function sort() {
          var dir = th.getAttribute('aria-sort') === 'ascending' ? -1 : 1;
          var numeric = th.classList.contains('num');
          var rows = Array.prototype.slice.call(tbody.rows).filter(function (r) { return !r.classList.contains('total') && !r.classList.contains('empty'); });
          rows.sort(function (a, b) {
            var x = a.cells[col] ? a.cells[col].textContent.trim() : '';
            var y = b.cells[col] ? b.cells[col].textContent.trim() : '';
            if (numeric) return (num(x) - num(y)) * dir;
            return x.localeCompare(y, undefined, { numeric: true }) * dir;
          });
          rows.forEach(function (r) { tbody.appendChild(r); });
          Array.prototype.forEach.call(tbody.querySelectorAll('tr.total, tr.empty'), function (r) { tbody.appendChild(r); });
          heads.forEach(function (o) { o.setAttribute('aria-sort', 'none'); });
          th.setAttribute('aria-sort', dir === 1 ? 'ascending' : 'descending');
        }
        th.addEventListener('click', sort);
        th.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sort(); } });
      });
    });
  } catch (e) { /* enhancements are optional */ }
})();
</script>
